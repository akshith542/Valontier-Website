<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- GreenHaven Landscaping — custom line icons (stroke, currentColor). Demo by Volontier. -->

<!-- Lawn / grass blades -->
<symbol id="ic-grass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 20h18"/>
  <path d="M7 20c-1-4 .5-6.5 1.5-8"/>
  <path d="M12 20c-1.2-5 .8-7.5 1.2-9.5"/>
  <path d="M17 20c-1-4 .8-5.5 2-7"/>
  <path d="M12 20c1.2-3.5 0-6 0-6"/>
</symbol>

<!-- Garden design / flower -->
<symbol id="ic-flower" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 11c-2.4-1.7-2.4-4.8 0-7 2.4 2.2 2.4 5.3 0 7Z"/>
  <path d="M12 11C9.6 9.6 6.6 10.2 6 13c2.9.6 5.4-.2 6-2Z"/>
  <path d="M12 11c2.4-1.4 5.4-.8 6 2-2.9.6-5.4-.2-6-2Z"/>
  <path d="M12 11v9"/>
  <path d="M12 16c-1.6-1-3.4-.8-4.4.4"/>
</symbol>

<!-- Mulching / layered coverage -->
<symbol id="ic-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3.5 21 8l-9 4.5L3 8l9-4.5Z"/>
  <path d="m3.5 12.5 8.5 4.2 8.5-4.2"/>
</symbol>

<!-- Seasonal cleanup / rake -->
<symbol id="ic-rake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3v9"/>
  <path d="M6 12h12"/>
  <path d="M7 12v3M11 12v3M13 12v3M17 12v3"/>
</symbol>

<!-- Hedge / shears -->
<symbol id="ic-shears" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="6" cy="7" r="2.4"/>
  <circle cx="6" cy="17" r="2.4"/>
  <path d="M8.1 8.2 20 16"/>
  <path d="M8.1 15.8 20 8"/>
  <path d="m12 12 .01 0"/>
</symbol>

<!-- Property refresh / sparkle -->
<symbol id="ic-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3c.4 4.3 1.7 5.6 6 6-4.3.4-5.6 1.7-6 6-.4-4.3-1.7-5.6-6-6 4.3-.4 5.6-1.7 6-6Z"/>
  <path d="M18.5 14.5c.2 1.8.7 2.3 2.5 2.5-1.8.2-2.3.7-2.5 2.5-.2-1.8-.7-2.3-2.5-2.5 1.8-.2 2.3-.7 2.5-2.5Z"/>
</symbol>

<!-- Reliable scheduling / calendar -->
<symbol id="ic-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="5.5" width="16" height="15" rx="2.5"/>
  <path d="M4 10h16"/>
  <path d="M8 3.5v4M16 3.5v4"/>
  <path d="m9 15 2 2 3.5-3.5"/>
</symbol>

<!-- Clean professional work / shield check -->
<symbol id="ic-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3 20 6v5.2c0 4.8-3.4 8-8 9.3-4.6-1.3-8-4.5-8-9.3V6l8-3Z"/>
  <path d="m8.8 12 2.2 2.2L15.4 10"/>
</symbol>

<!-- Easy communication / chat -->
<symbol id="ic-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 5h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-8l-4.5 3.5V16H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/>
  <path d="M8 9.5h8M8 12.5h5"/>
</symbol>

<!-- Eco-conscious / leaf -->
<symbol id="ic-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 19c0-8 6-14 15-14 0 9-6 14-15 14Z"/>
  <path d="M5 19C7 14 11 10 16 8"/>
</symbol>

<!-- Sprout / leaf accent -->
<symbol id="ic-sprout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 20v-8"/>
  <path d="M12 14c-1-3-3.5-4.5-7-4.5.2 3.4 2.8 5.5 7 5.5Z"/>
  <path d="M12 12c.8-2.8 3-4.2 6.5-4.2C18.3 10.7 16 12.5 12 12.5Z"/>
</symbol>

<!-- Contact: phone -->
<symbol id="ic-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6.5 4h3l1.5 4-2 1.5a11 11 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 6a2 2 0 0 1 2-2Z"/>
</symbol>

<!-- Contact: mail -->
<symbol id="ic-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/>
  <path d="m4.5 7.5 7.5 5.5 7.5-5.5"/>
</symbol>

<!-- Contact: pin -->
<symbol id="ic-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 21c4-4.5 6-8 6-11a6 6 0 0 0-12 0c0 3 2 6.5 6 11Z"/>
  <circle cx="12" cy="10" r="2.3"/>
</symbol>

<!-- Contact: clock -->
<symbol id="ic-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="8"/>
  <path d="M12 7.5V12l3 2"/>
</symbol>

<!-- Arrow (inline buttons reuse SVG, but provide for completeness) -->
<symbol id="ic-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 8h10M9 4l4 4-4 4"/>
</symbol>
</svg>
